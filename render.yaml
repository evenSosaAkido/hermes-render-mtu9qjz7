# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
#
# Hermes Agent on Render, pre-baked with Render tools — behind Okta SSO.
# https://github.com/NousResearch/hermes-agent
#
# SECURITY ARCHITECTURE (see README "Authentication (Okta SSO)"):
#
#   Okta (OIDC, group-gated)
#         │  login
#         ▼
#   [ hermes-auth ]  type: web   — the ONLY public service (oauth2-proxy)
#         │  private network (region-internal, never public)
#         ▼
#   [ hermes ]       type: pserv — private service, NO public URL
#         │
#         ▼
#     /opt/data (persistent disk)
#
# The Hermes dashboard has no built-in auth, so it is deployed as a PRIVATE
# service (no onrender.com URL, reachable only on Render's in-region private
# network). oauth2-proxy is the public entrypoint: it forces an Okta OIDC
# login and only proxies members of the allowed Okta group through to Hermes.
#
# Both services MUST be in the same region for private networking to work.
#
# PHI NOTE: This auth layer is necessary but NOT sufficient for HIPAA. Real
# PHI additionally requires a HIPAA-enabled Render workspace (Scale/Enterprise
# plan + signed BAA), scrubbing PHI from Hermes logs, and BAAs with every
# downstream (Bedrock ✓, EHR, Quickbase). See the README.
#
# To upgrade Hermes: bump HERMES_IMAGE in the Dockerfile and redeploy.
# To upgrade Render skills: bump RENDER_SKILLS_REF and redeploy.

services:
  # ===========================================================================
  # Public auth gateway (oauth2-proxy). The only internet-reachable service.
  # Authenticates every request against Okta via OIDC and only forwards users
  # in OAUTH2_PROXY_ALLOWED_GROUPS through to the private Hermes service.
  # ===========================================================================
  - type: web
    name: hermes-auth
    runtime: image
    region: oregon
    plan: starter
    image:
      # Pinned oauth2-proxy release. Public image, no registry creds needed.
      url: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
    healthCheckPath: /ping
    autoDeployTrigger: off
    envVars:
      # Listen on Render's expected web port and trust its load balancer's
      # X-Forwarded-* headers (needed for correct redirect/cookie behavior).
      - key: OAUTH2_PROXY_HTTP_ADDRESS
        value: "0.0.0.0:10000"
      - key: OAUTH2_PROXY_REVERSE_PROXY
        value: "true"

      # Okta via generic OIDC. Skip the interstitial button so users go
      # straight to Okta.
      - key: OAUTH2_PROXY_PROVIDER
        value: oidc
      - key: OAUTH2_PROXY_PROVIDER_DISPLAY_NAME
        value: Okta
      - key: OAUTH2_PROXY_SKIP_PROVIDER_BUTTON
        value: "true"

      # Upstream = the private Hermes service, reached by its service name on
      # the region-internal private network. Confirm the exact "Internal
      # Address" on the hermes service's dashboard page if this ever changes.
      - key: OAUTH2_PROXY_UPSTREAMS
        value: http://hermes:10000

      # Accept any verified email domain; group membership is the real gate.
      # Narrow to your domain (e.g. "akido.com") for defense in depth.
      - key: OAUTH2_PROXY_EMAIL_DOMAINS
        value: "*"

      # Request the groups claim and enforce membership. Requires the Okta
      # authorization server to emit a "groups" claim (see README).
      - key: OAUTH2_PROXY_SCOPE
        value: "openid email profile groups"
      - key: OAUTH2_PROXY_OIDC_GROUPS_CLAIM
        value: groups

      # Session cookie is HTTPS-only (Render terminates TLS at the edge).
      - key: OAUTH2_PROXY_COOKIE_SECURE
        value: "true"

      # ---- Set these from the Render Environment tab (sync: false) ----------
      # OIDC issuer, e.g. https://YOUR_ORG.okta.com/oauth2/default
      - key: OAUTH2_PROXY_OIDC_ISSUER_URL
        sync: false
      - key: OAUTH2_PROXY_CLIENT_ID
        sync: false
      - key: OAUTH2_PROXY_CLIENT_SECRET
        sync: false
      # 32-byte cookie secret. Generate with: scripts/gen-cookie-secret.sh
      - key: OAUTH2_PROXY_COOKIE_SECRET
        sync: false
      # Must exactly match the Okta app's redirect URI and this service's URL:
      #   https://<hermes-auth service>.onrender.com/oauth2/callback
      - key: OAUTH2_PROXY_REDIRECT_URL
        sync: false
      # Comma-separated Okta group name(s) allowed in, e.g. "hermes-users"
      - key: OAUTH2_PROXY_ALLOWED_GROUPS
        sync: false

  # ===========================================================================
  # Hermes itself — now a PRIVATE service. No onrender.com URL; reachable only
  # by hermes-auth over the private network. Everything else is unchanged from
  # the standard template (Dockerfile build, disk, dashboard side-process).
  # ===========================================================================
  - type: pserv
    name: hermes
    runtime: docker
    region: oregon
    plan: standard
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: off
    healthCheckPath: /api/status

    disk:
      name: hermes-data
      mountPath: /opt/data
      sizeGB: 5

    envVars:
      # Dashboard side-process. The entrypoint backgrounds `hermes dashboard`
      # before exec'ing `gateway run` whenever HERMES_DASHBOARD is truthy.
      # HERMES_DASHBOARD_HOST=0.0.0.0 makes it bind all interfaces (and pass
      # --insecure) so hermes-auth can reach it over the private network.
      - key: HERMES_DASHBOARD
        value: "1"
      - key: HERMES_DASHBOARD_HOST
        value: "0.0.0.0"
      - key: HERMES_DASHBOARD_PORT
        value: "10000"
      # Full Hermes TUI in the browser (server-side PTY + xterm.js).
      - key: HERMES_DASHBOARD_TUI
        value: "1"

      # Generated once at first deploy. Reuse as API_SERVER_KEY in the
      # dashboard if you later opt into the OpenAI-compatible API server.
      - key: HERMES_GATEWAY_TOKEN
        generateValue: true

      # Bearer token for the pre-registered Render MCP server. Set from the
      # Environment tab; the boot-time patcher reads ${RENDER_MCP_API_KEY}
      # into config.yaml lazily, so rotate by editing + restarting.
      - key: RENDER_MCP_API_KEY
        sync: false
